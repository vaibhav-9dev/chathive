<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="/chathive/manifest.json">
<meta name="theme-color" content="#4A90E2">
<style>
  /* From Uiverse.io by micaelgomestavares */
  body { display:flex; justify-content:center; align-items:center; height:100vh; background:#f0f2f5; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .form { display:flex; flex-direction:column; gap:10px; background:white; padding:30px; width:400px; border-radius:20px; box-shadow:0 8px 20px rgba(0,0,0,0.1);}
  ::placeholder { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .inputForm { border:1.5px solid #ecedec; border-radius:10px; height:50px; display:flex; align-items:center; padding-left:10px; transition:0.2s ease-in-out; }
  .inputForm:focus-within { border-color:#2d79f3; }
  .input { margin-left:10px; border:none; width:85%; height:100%; outline:none; border-radius:10px; }
  .flex-row { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .span { font-size:14px; color:#2d79f3; cursor:pointer; }
  .button-submit { margin:20px 0 10px 0; background:#151717; border:none; color:white; font-size:15px; font-weight:500; border-radius:10px; height:50px; cursor:pointer; }
  .button-submit:hover { background:#252727; }
  .error { color:red; font-size:14px; text-align:center; }
  .btn { margin-top:10px; width:100%; height:50px; border-radius:10px; display:flex; justify-content:center; align-items:center; gap:10px; border:1px solid #ededef; background:white; cursor:pointer; transition:0.2s ease-in-out; }
  .btn:hover { border-color:#2d79f3; }
</style>
</head>
<body>

<form class="form" id="loginForm">
  <h2 class="text-2xl font-bold text-center mb-4">Login</h2>

  <div class="error" id="error-msg"></div>

  <div class="inputForm">
    <input type="email" placeholder="Email" id="email" class="input" required>
  </div>

  <div class="inputForm">
    <input type="password" placeholder="Password" id="password" class="input" required>
  </div>

  <div class="flex-row">
    <label><input type="checkbox" id="remember"> Remember me</label>
    <span class="span" onclick="forgotPassword()">Forgot password?</span>
  </div>

  <button type="submit" class="button-submit">Login</button>

  <p class="p text-center mt-2">Or login with</p>

  <button type="button" class="btn google" id="google-login">
    <svg height="20" width="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <path style="fill:#FBBB00;" d="M113.47,309.408L95.648,375.94l-65.139,1.378C11.042,341.211,0,299.9,0,256
      c0-42.451,10.324-82.483,28.624-117.732h0.014l57.992,10.632l25.404,57.644c-5.317,15.501-8.215,32.141-8.215,49.456
      C103.821,274.792,107.225,292.797,113.47,309.408z"/>
      <path style="fill:#518EF8;" d="M507.527,208.176C510.467,223.662,512,239.655,512,256c0,18.328-1.927,36.206-5.598,53.451
      c-12.462,58.683-45.025,109.925-90.134,146.187l-0.014-0.014l-73.044-3.727l-10.338-64.535
      c29.932-17.554,53.324-45.025,65.646-77.911h-136.89V208.176h138.887"/>
      <path style="fill:#28B446;" d="M416.253,455.624l0.014,0.014C372.396,490.901,316.666,512,256,512
      c-97.491,0-182.252-54.491-225.491-134.681l82.961-67.91c21.619,57.698,77.278,98.771,142.53,98.771
      c28.047,0,54.323-7.582,76.87-20.818L416.253,455.624z"/>
      <path style="fill:#F14336;" d="M419.404,58.936l-82.933,67.896c-23.335-14.586-50.919-23.012-80.471-23.012
      c-66.729,0-123.429,42.957-143.965,102.724l-83.397-68.276h-0.014C71.23,56.123,157.06,0,256,0
      C318.115,0,375.068,22.126,419.404,58.936z"/>
    </svg>
    Google
  </button>

  <p class="p text-center mt-4">Don't have an account? <span class="span" onclick="window.location.href='signup.html'">Sign Up</span></p>
</form>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTCAJI5pMu8g7LMZCEu_mBAfUnEdf34O8",
  authDomain: "chatspot-2eba4.firebaseapp.com",
  databaseURL: "https://chatspot-2eba4-default-rtdb.firebaseio.com/",
  projectId: "chatspot-2eba4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

const errorMsg = document.getElementById("error-msg");
const form = document.getElementById("loginForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorMsg.textContent = "";
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    const userCred = await signInWithEmailAndPassword(auth, email, password);
    localStorage.setItem("uid", userCred.user.uid);
    window.location.href = "messages_home.html";
  } catch (error) {
    if (error.code === "auth/user-not-found") errorMsg.textContent = "Account not found.";
    else if (error.code === "auth/wrong-password") errorMsg.textContent = "Incorrect password.";
    else errorMsg.textContent = error.message;
  }
});

// Google Sign-In
document.getElementById("google-login").addEventListener("click", async () => {
  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    localStorage.setItem("uid", user.uid);

    // save user if first login
    await set(ref(db, "users/" + user.uid), { name: user.displayName, email: user.email });
    window.location.href = "messages_home.html";
  } catch (error) {
    errorMsg.textContent = error.message;
  }
});

// Forgot Password
window.forgotPassword = async function() {
  const email = document.getElementById("email").value;
  if (!email) return alert("Please enter your email to reset password.");
  try {
    await sendPasswordResetEmail(auth, email);
    alert("Password reset email sent.");
  } catch (error) {
    alert(error.message);
  }
};
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js")
    .then(() => console.log("SW registered"));
}
</script>
</body>
</html>
