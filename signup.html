<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4A90E2">
<style>
/* Uiverse-inspired styling */
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  background-color: #f5f5f7;
}
.form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  background-color: #ffffff;
  padding: 35px;
  width: 400px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}
.inputForm {
  border: 1.5px solid #ecedec;
  border-radius: 10px;
  height: 50px;
  display: flex;
  align-items: center;
  padding-left: 10px;
  transition: 0.2s ease-in-out;
}
.input {
  margin-left: 10px;
  border: none;
  width: 85%;
  height: 100%;
  border-radius: 10px;
}
.input:focus { outline: none; }
.inputForm:focus-within { border: 1.5px solid #2d79f3; }
.button-submit {
  margin: 20px 0 10px 0;
  background-color: #151717;
  border: none;
  color: white;
  font-size: 15px;
  font-weight: 500;
  border-radius: 10px;
  height: 50px;
  width: 100%;
  cursor: pointer;
  transition: 0.2s;
}
.button-submit:hover { background-color: #252727; }
.error-msg { color: red; text-align: center; font-size: 14px; margin-top: 5px; }
.flex-row { display: flex; justify-content: space-between; align-items: center; }
.span { color: #2d79f3; cursor: pointer; font-weight: 500; }
.social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 10px; height: 50px; cursor: pointer; border: 1px solid #ededef; background: white; transition: 0.2s; font-weight: 500; width: 100%; }
.social-btn:hover { border-color: #2d79f3; }
</style>
</head>
<body>

<form class="form" id="signupForm">
  <h2 class="text-2xl font-bold text-center mb-3">Create Account</h2>
  
  <div id="errorMessage" class="error-msg"></div>

  <!-- Full Name -->
  <div class="inputForm">
    <input type="text" id="fullName" class="input" placeholder="Full Name" required>
  </div>

  <!-- Email -->
  <div class="inputForm">
    <input type="email" id="email" class="input" placeholder="Email" required>
  </div>

  <!-- Password -->
  <div class="inputForm">
    <input type="password" id="password" class="input" placeholder="Password (min 6 chars)" required>
  </div>

  <button type="submit" class="button-submit">Sign Up</button>

  <p class="text-center mt-2">Already have an account? <span class="span" onclick="location.href='login.html'">Login</span></p>

  <p class="text-center mt-2">Or sign up with</p>

  <div class="flex flex-col gap-2 mt-2">
    <div class="social-btn" id="googleBtn">
      <svg height="20" viewBox="0 0 512 512"><path style="fill:#FBBB00;" d="M113.47,309.408L95.648,375.94l-65.139,1.378C11.042,341.211,0,299.9,0,256c0-42.451,10.324-82.483,28.624-117.732h0.014l57.992,10.632l25.404,57.644c-5.317,15.501-8.215,32.141-8.215,49.456C103.821,274.792,107.225,292.797,113.47,309.408z"></path><path style="fill:#518EF8;" d="M507.527,208.176C510.467,223.662,512,239.655,512,256c0,18.328-1.927,36.206-5.598,53.451c-12.462,58.683-45.025,109.925-90.134,146.187l-0.014-0.014l-73.044-3.727l-10.338-64.535c29.932-17.554,53.324-45.025,65.646-77.911h-136.89V208.176h138.887L507.527,208.176L507.527,208.176z"></path><path style="fill:#28B446;" d="M416.253,455.624l0.014,0.014C372.396,490.901,316.666,512,256,512c-97.491,0-182.252-54.491-225.491-134.681l82.961-67.91c21.619,57.698,77.278,98.771,142.53,98.771c28.047,0,54.323-7.582,76.87-20.818L416.253,455.624z"></path><path style="fill:#F14336;" d="M419.404,58.936l-82.933,67.896c-23.335-14.586-50.919-23.012-80.471-23.012c-66.729,0-123.429,42.957-143.965,102.724l-83.397-68.276h-0.014C71.23,56.123,157.06,0,256,0C318.115,0,375.068,22.126,419.404,58.936z"></path></svg>
      Google
    </div>

    <div class="social-btn" id="appleBtn">
      <svg height="20" width="20" viewBox="0 0 22.773 22.773"><path d="M15.769,0c0.053,0,0.106,0,0.162,0c0.13,1.606-0.483,2.806-1.228,3.675c-0.731,0.863-1.732,1.7-3.351,1.573c-0.108-1.583,0.506-2.694,1.25-3.561C13.292,0.879,14.557,0.16,15.769,0z"></path><path d="M20.67,16.716c0,0.016,0,0.03,0,0.045c-0.455,1.378-1.104,2.559-1.896,3.655c-0.723,0.995-1.609,2.334-3.191,2.334c-1.367,0-2.275-0.879-3.676-0.903c-1.482-0.024-2.297,0.735-3.652,0.926c-0.155,0-0.31,0-0.462,0c-0.995-0.144-1.798-0.932-2.383-1.642c-1.725-2.098-3.058-4.808-3.306-8.276c0-0.34,0-0.679,0-1.019c0.105-2.482,1.311-4.5,2.914-5.478c0.846-0.52,2.009-0.963,3.304-0.765c0.555,0.086,1.122,0.276,1.619,0.464c0.471,0.181,1.06,0.502,1.618,0.485c0.378-0.011,0.754-0.208,1.135-0.347c1.116-0.403,2.21-0.865,3.652-0.648c1.733,0.262,2.963,1.032,3.723,2.22c-1.466,0.933-2.625,2.339-2.427,4.74C17.818,14.688,19.086,15.964,20.67,16.716z"></path></svg>
      Apple
    </div>
  </div>
</form>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTCAJI5pMu8g7LMZCEu_mBAfUnEdf34O8",
  authDomain: "chatspot-2eba4.firebaseapp.com",
  databaseURL: "https://chatspot-2eba4-default-rtdb.firebaseio.com/",
  projectId: "chatspot-2eba4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const form = document.getElementById("signupForm");
const errorDiv = document.getElementById("errorMessage");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorDiv.innerText = "";

  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (password.length < 6) {
    errorDiv.innerText = "Password must be at least 6 characters";
    return;
  }

  try {
    const userCred = await createUserWithEmailAndPassword(auth, email, password);
    const uid = userCred.user.uid;

    await set(ref(db, "users/" + uid), {
      name: fullName,
      email: email
    });

    localStorage.setItem("uid", uid);
    window.location.href = "messages_home.html";
  } catch (error) {
    if (error.code === "auth/email-already-in-use") {
      errorDiv.innerText = "Email already in use";
    } else {
      errorDiv.innerText = error.message;
    }
  }
});

// Google OAuth
document.getElementById("googleBtn").onclick = async () => {
  const provider = new GoogleAuthProvider();
  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    // store name & email
    await set(ref(db, "users/" + user.uid), {
      name: user.displayName,
      email: user.email
    });

    localStorage.setItem("uid", user.uid);
    window.location.href = "messages_home.html";
  } catch (error) {
    errorDiv.innerText = error.message;
  }
};

// Apple OAuth placeholder
document.getElementById("appleBtn").onclick = () => {
  alert("Apple sign-in requires Apple Developer setup.");
};
</script>
</body>
</html>
