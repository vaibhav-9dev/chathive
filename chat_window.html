<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- 🔥 CRITICAL VIEWPORT FIX -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Chat</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="manifest" href="/chathive/manifest.json">
<meta name="theme-color" content="#4A90E2">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'chat-bg': '#F0F2F5',
        'bubble-sent': '#007AFF',
        'bubble-received': '#E9E9EB',
      }
    }
  }
}
</script>

<style>
html, body {
  height: 100%;
}

.safe-bottom {
  padding-bottom: env(safe-area-inset-bottom);
}

#message-container {
  -webkit-overflow-scrolling: touch;
}
</style>

</head>

<body class="bg-chat-bg font-sans">

<!-- MAIN -->
<div class="flex flex-col h-[100dvh] max-w-md mx-auto bg-white">

  <!-- HEADER -->
  <div class="flex items-center gap-3 p-3 border-b sticky top-0 bg-white z-50">

    <button onclick="goBack()" class="text-blue-500">
      ←
    </button>

    <div>
      <h1 id="chat-name" class="font-semibold text-sm">Loading...</h1>
      <p id="status-text" class="text-xs text-gray-500">...</p>
    </div>

  </div>

  <!-- MESSAGES -->
  <div id="message-container"
    class="flex-1 overflow-y-auto p-3 space-y-3 pb-24">
  </div>

</div>

<!-- INPUT BAR -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t px-3 py-2 flex items-center gap-2 safe-bottom">

  <textarea id="chat-input"
    rows="1"
    class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-blue-400"
    placeholder="Message"></textarea>

  <button id="send-button"
    class="p-2.5 bg-blue-500 text-white rounded-full active:scale-95">
    ➤
  </button>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getDatabase, ref, push, set, onValue, get, update, onDisconnect
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// CONFIG
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "chatspot-2eba4.firebaseapp.com",
  databaseURL: "https://chatspot-2eba4-default-rtdb.firebaseio.com/",
  projectId: "chatspot-2eba4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// USER
const currentUser = localStorage.getItem("uid");
if (!currentUser) window.location.href = "login.html";

// CHAT ID
const params = new URLSearchParams(window.location.search);
const chatId = params.get("chatId");

const messagesRef = ref(db, `messages/${chatId}`);
const chatRef = ref(db, `chats/${chatId}`);
const usersRef = ref(db, "users");

const container = document.getElementById("message-container");
const statusText = document.getElementById("status-text");

// 🔥 PRESENCE
const myStatusRef = ref(db, "status/" + currentUser);

set(myStatusRef, {
  online: true,
  lastSeen: Date.now(),
  typing: false
});

onDisconnect(myStatusRef).set({
  online: false,
  lastSeen: Date.now(),
  typing: false
});

// 🔥 LOAD CHAT USER
let otherUser = null;

const chatSnap = await get(chatRef);
const usersSnap = await get(usersRef);

if (chatSnap.exists()) {
  const chat = chatSnap.val();
  const users = usersSnap.val() || {};

  otherUser = Object.keys(chat.participants)
    .find(u => u !== currentUser);

  document.getElementById("chat-name").innerText =
    users[otherUser]?.name || "User";
}

// 🔥 STATUS LISTENER
onValue(ref(db, "status/" + otherUser), (snap) => {
  if (!snap.exists()) return;

  const s = snap.val();

  if (s.typing) {
    statusText.innerText = "Typing...";
  } else if (s.online) {
    statusText.innerText = "Online";
  } else {
    const time = new Date(s.lastSeen)
      .toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });

    statusText.innerText = "Last seen " + time;
  }
});

// 🔥 MESSAGES
onValue(messagesRef, async (snapshot) => {

  container.innerHTML = "";

  if (!snapshot.exists()) return;

  let messages = Object.entries(snapshot.val());

  messages.sort((a,b) => a[1].timestamp - b[1].timestamp);

  for (let [id, msg] of messages) {

    const div = document.createElement("div");

    const time = new Date(msg.timestamp)
      .toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

    if (msg.sender === currentUser) {

      div.className = "flex justify-end";

      div.innerHTML = `
        <div class="bg-bubble-sent text-white px-4 py-2 rounded-2xl max-w-[70%]">
          ${msg.text}
          <div class="text-xs text-right mt-1 opacity-70">
            ${time} ${msg.seen ? "✔✔" : "✔"}
          </div>
        </div>
      `;

    } else {

      div.className = "flex justify-start";

      div.innerHTML = `
        <div class="bg-bubble-received px-4 py-2 rounded-2xl max-w-[70%]">
          ${msg.text}
          <div class="text-xs text-right mt-1 text-gray-400">${time}</div>
        </div>
      `;

      if (!msg.seen) {
        await update(ref(db, `messages/${chatId}/${id}`), { seen: true });
      }
    }

    container.appendChild(div);
  }

  container.scrollTop = container.scrollHeight;
});

// 🔥 INPUT LOGIC
const textarea = document.getElementById("chat-input");

textarea.addEventListener("input", () => {
  textarea.style.height = "auto";
  textarea.style.height = textarea.scrollHeight + "px";

  update(ref(db, "status/" + currentUser), { typing: true });

  clearTimeout(window.typingTimeout);
  window.typingTimeout = setTimeout(() => {
    update(ref(db, "status/" + currentUser), { typing: false });
  }, 1500);
});

// SEND
document.getElementById("send-button").onclick = async () => {

  const text = textarea.value.trim();
  if (!text) return;

  const newMsg = push(messagesRef);

  await set(newMsg, {
    sender: currentUser,
    text,
    timestamp: Date.now(),
    seen: false
  });

  await update(chatRef, {
    lastMessage: text,
    lastTime: Date.now()
  });

  textarea.value = "";
  textarea.style.height = "auto";

  update(ref(db, "status/" + currentUser), { typing: false });
};

// BACK
window.goBack = () => {
  window.location.href = "messages_home.html";
};

</script>

</body>
</html>
