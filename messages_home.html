<!DOCTYPE html>
<html lang="en">
<head>

<script>

      colors: {
        'soft-orange': '#FFF4E6',
        'brand-orange': '#F97316',
        'chat-text': '#333333',
        'chat-muted': '#8E8E93'
      }
    }
  }
}
</script>

<style>

  display: -webkit-box;
  -webkit-line-clamp: 1;

<body class="bg-white text-chat-text min-h-screen flex flex-col">

<!-- HEADER -->
<header class="sticky top-0 z-10 bg-white/80 backdrop-blur-md border-b border-gray-100 p-4">

  <div class="flex justify-between items-center mb-4">

    <!-- 🔶 LOGO + TITLE -->
    <div class="flex items-center gap-3">
      <img src="icons/icon-196.png"
           class="w-10 h-10 rounded-xl shadow-md bg-orange-100 p-1">

      <h1 class="text-2xl font-bold text-brand-orange">
        Messages
      </h1>
    </div>

    <!-- PROFILE -->
    <img id="header-profile-pic"
         onclick="window.location.href='user_profile.html'"
         class="w-10 h-10 rounded-full object-cover cursor-pointer border"
         src="https://i.pravatar.cc/150">
  </div>

  <!-- 🔍 SEARCH -->
  <div class="relative group">

    <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
      <svg class="w-5 h-5 text-gray-400 group-focus-within:text-brand-orange transition"
           fill="none" stroke="currentColor" stroke-width="2"
           viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>

    <input id="searchInput"
      type="text"
      placeholder="Search conversations..."
      class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-soft-orange text-sm
             border border-transparent
             focus:bg-white focus:border-brand-orange
             focus:ring-2 focus:ring-brand-orange/30
             outline-none transition-all duration-200 shadow-sm"/>

    <button id="clearSearch"
      class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-red-500 hidden">
      ✕
    </button>

  </div>
</header>

<!-- CHAT LIST -->
<div id="chat-list" class="flex-grow overflow-y-auto px-4 pb-24"></div>

<!-- FLOAT BUTTON -->
<button onclick="goToContacts()"
class="fixed bottom-16 right-6 w-14 h-14 bg-brand-orange text-white rounded-full shadow-lg flex items-center justify-center">
+
</button>

<!-- NAV -->
<nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-sm border-t border-gray-100 flex justify-around items-center py-3" data-purpose="bottom-nav">
  <a href="messages_home.html">
<button class="flex flex-col items-center text-brand-orange">
<svg class="w-6 h-6" fill="currentColor" viewbox="0 0 20 20">
<path d="M2 5a2 2 0 012-2h7a2 2 0 012 2v4a2 2 0 01-2 2H9l-3 3v-3H4a2 2 0 01-2-2V5z"></path>
<path d="M15 7v2a4 4 0 01-4 4H9.828l-1.766 1.767c.28.149.599.233.938.233h2l3 3v-3h2a2 2 0 002-2V9a2 2 0 00-2-2h-1z"></path>
</svg>
<span class="text-[10px] mt-1 font-medium">Chats</span>
</button>
  </a>
  <a href="contacts_list.html">
<button class="flex flex-col items-center text-gray-400">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] mt-1 font-medium">People</span>
</button>
  </a>
  <a href="user_profile.html">
<button class="flex flex-col items-center text-gray-400">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] mt-1 font-medium">Profile</span>
</button>
  </a>
</nav>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getDatabase, ref, onValue, get, set, onDisconnect 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTCAJI5pMu8g7LMZCEu_mBAfUnEdf34O8",
  authDomain: "chatspot-2eba4.firebaseapp.com",
  databaseURL: "https://chatspot-2eba4-default-rtdb.firebaseio.com/",
  projectId: "chatspot-2eba4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const currentUser = localStorage.getItem("uid");
if (!currentUser) window.location.href = "login.html";

// PROFILE PIC
onValue(ref(db, "users/" + currentUser), (snap) => {
  if (!snap.exists()) return;
  const data = snap.val();
  document.getElementById("header-profile-pic").src =
    data.avatar || `https://i.pravatar.cc/150?u=${currentUser}`;
});

// PRESENCE
const statusRef = ref(db, "status/" + currentUser);

set(statusRef, {
  online: true,
  lastSeen: Date.now(),
  typing: false
});

onDisconnect(statusRef).set({
  online: false,
  lastSeen: Date.now(),
  typing: false
});

// REFS
const chatsRef = ref(db, "chats");
const usersRef = ref(db, "users");

// CHAT LIST
onValue(chatsRef, async (snapshot) => {

  const container = document.getElementById("chat-list");
  container.innerHTML = "";

  if (!snapshot.exists()) {
    container.innerHTML = "No chats yet";
    return;
  }

  const usersSnap = await get(usersRef);
  const users = usersSnap.val() || {};
  const chats = snapshot.val();

  let chatArray = [];

  for (let chatId in chats) {

    const chat = chats[chatId];

    if (!chat.participants || !chat.participants[currentUser]) continue;

    const otherUser = Object.keys(chat.participants)
      .find(u => u !== currentUser);

    chatArray.push({
      chatId,
      otherUser,
      lastMessage: chat.lastMessage || "",
      time: chat.lastTime || 0
    });
  }

  chatArray.sort((a,b) => b.time - a.time);

  for (let chat of chatArray) {

    const user = users[chat.otherUser] || {};

    let preview = chat.lastMessage;

    const statusSnap = await get(ref(db, "status/" + chat.otherUser));
    if (statusSnap.exists() && statusSnap.val().typing) {
      preview = "Typing...";
    }

    let tick = "";
    const msgSnap = await get(ref(db, `messages/${chat.chatId}`));

    if (msgSnap.exists()) {
      const msgs = Object.values(msgSnap.val());
      const last = msgs[msgs.length - 1];

      if (last.sender === currentUser) {
        tick = last.seen ? "✔✔ " : "✔ ";
      }
    }

    const div = document.createElement("div");

    div.className = "flex items-center p-3 border-b cursor-pointer hover:bg-soft-orange transition";
    div.onclick = () => openChat(chat.chatId);

    div.innerHTML = `
      <img class="w-12 h-12 rounded-full"
        src="${user.avatar || `https://i.pravatar.cc/150?u=${chat.otherUser}`}">

      <div class="ml-3 flex-1">
        <div class="flex justify-between">
          <p class="font-semibold">${user.name || "User"}</p>
          <p class="text-xs text-gray-400">${formatTime(chat.time)}</p>
        </div>

        <p class="text-sm text-gray-500 truncate">
          ${tick}${preview}
        </p>
      </div>
    `;

    container.appendChild(div);
  }

});

// TIME
function formatTime(ts){
  if (!ts) return "";
  return new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

// NAV
window.openChat = (id) => {
  window.location.href = `chat_window.html?chatId=${id}`;
};

window.goToContacts = () => {
  window.location.href = "contacts_list.html";
};

// SEARCH
const searchInput = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearSearch");

searchInput.addEventListener("input", () => {
  const value = searchInput.value.toLowerCase();
  const chats = document.querySelectorAll("#chat-list > div");

  clearBtn.style.display = value ? "flex" : "none";

  chats.forEach(chat => {
    const name = chat.querySelector("p").innerText.toLowerCase();
    const message = chat.querySelectorAll("p")[1].innerText.toLowerCase();

    if (name.includes(value) || message.includes(value)) {
      chat.style.display = "flex";
    } else {
      chat.style.display = "none";
    }
  });
});

clearBtn.onclick = () => {
  searchInput.value = "";
  clearBtn.style.display = "none";
  document.querySelectorAll("#chat-list > div")
    .forEach(chat => chat.style.display = "flex");
};

</script>

</body>
</html>
